name: Shared-secret mutation

# The shared-secret mutants of `includes/Auth.php`, scored weekly (#147, D-119).
#
# `ci.yml`'s weekly pass runs `composer mutate` in the process where
# `UAMSWP_MIGRATION_API_SECRET` is undefined, and its `--covered-only` drops
# the lines only a defined secret reaches. A constant cannot change once set, so
# `scripts/mutate-secret-states.php` mutates `Auth.php` once per secret state
# (none, secret, empty, non-string), each over its own test file, and fails
# when a mutant on the shared-secret lines is killed in no state.
#
# Its own workflow rather than a job in `ci.yml`, deliberately. It runs on a
# schedule and on demand only, never on a pull request or a push: the secret
# path changes rarely, so a weekly score catches a weakened test without
# charging every pull request that touches `Auth.php` (D-119). A job in `ci.yml`
# would be one the `CI` aggregate needs, and that aggregate fails a skipped job,
# so every pull request would fail it. It is also not a job of the shared
# chain's `mutate`, which runs `composer mutate` once with one set of
# environment variables, where these states need four.
#
# Linux only, like the shared chain's `mutate` job: a mutation score does not
# depend on the runner, and the job is long.

on:
  # Mondays at 08:17 UTC, forty minutes after `ci.yml`'s weekly pass, so the
  # two do not hold runners at once.
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  mutate-secret:
    name: Shared-secret mutants of Auth.php
    runs-on: ubuntu-latest
    # Budget kill-switch, as on every job in `ci.yml`.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 60
    services:
      mysql:
        # The same database the `pest` job in `ci.yml` uses, for the same
        # suite: created empty and thrown away with the runner.
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: uamswp_migration_api_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      # PCOV, not `coverage: none` as in the `pest` job: mutation testing reads
      # coverage to choose the tests each mutant runs.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          coverage: pcov
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock', 'tests/Integration/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install the Integration suite's Composer dependencies
        run: composer install --working-dir=tests/Integration --no-interaction --no-progress --prefer-dist

      # Read from the lock, as the `pest` job in `ci.yml` does: wp-phpunit and
      # WordPress are released in lockstep.
      - name: Resolve the WordPress version wp-phpunit pins
        id: wordpress
        run: |
          version=$(jq -r '.["packages-dev"][] | select(.name == "wp-phpunit/wp-phpunit") | .version' tests/Integration/composer.lock)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not read wp-phpunit/wp-phpunit from tests/Integration/composer.lock." >&2
            exit 1
          fi
          echo "slug=${version%.0}" >> "$GITHUB_OUTPUT"
          echo "WordPress ${version%.0} (wp-phpunit $version)"

      - name: Download WordPress ${{ steps.wordpress.outputs.slug }}
        run: |
          curl -sSfL "https://wordpress.org/wordpress-${{ steps.wordpress.outputs.slug }}.tar.gz" \
            -o "$RUNNER_TEMP/wordpress.tar.gz"
          tar -xzf "$RUNNER_TEMP/wordpress.tar.gz" -C "$RUNNER_TEMP"

      - name: Wait for MySQL
        run: |
          for _ in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become available." >&2
          exit 1

      - name: Mutate Auth.php in each secret state
        env:
          WP_TESTS_ABSPATH: ${{ runner.temp }}/wordpress
        run: composer mutate:secret
